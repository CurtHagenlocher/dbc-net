name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A superseded run on the same branch has nothing useful left to say.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The point of the matrix is the non-Windows runners: RID mapping, path
        # comparison, file permissions, and the cross-process cache lease all take
        # different code paths there.
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # 10.x builds the repository (see global.json); 8.0 supplies the runtime the
          # test projects target.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build dbc-net.slnx -c Release

      # No ADBC_DRIVERS_TESTS_NETWORK: this run must stay offline and deterministic.
      # The integration tests pack the product and drive real dotnet builds against a
      # local file:// fixture registry.
      - name: Test
        run: dotnet test dbc-net.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          retention-days: 14

  pack:
    name: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack
        run: dotnet pack src/Adbc.Drivers.Build/Adbc.Drivers.Build.csproj -c Release

      # A package that silently loses tools/ or build/ still packs successfully, so the
      # layout is asserted rather than assumed.
      - name: Verify package layout
        shell: bash
        run: |
          set -euo pipefail
          nupkg=$(ls artifacts/package/*.nupkg)
          echo "Inspecting $nupkg"
          contents=$(unzip -Z1 "$nupkg")
          echo "$contents"
          for required in \
            build/Adbc.Drivers.Build.props \
            build/Adbc.Drivers.Build.targets \
            buildMultiTargeting/Adbc.Drivers.Build.props \
            buildMultiTargeting/Adbc.Drivers.Build.targets \
            tools/netstandard2.0/Adbc.Drivers.Tasks.dll \
            tools/net472/Adbc.Drivers.Tasks.dll
          do
            echo "$contents" | grep -qx "$required" || { echo "missing: $required"; exit 1; }
          done
          # Build-time only: shipping a lib/ asset would make this a normal dependency.
          if echo "$contents" | grep -q '^lib/'; then
            echo "unexpected lib/ assets in a build-time-only package"; exit 1
          fi

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/package/*.nupkg
          retention-days: 14
